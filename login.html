<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>utileria.js — Iniciar sesión</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="tarjeta">
    <h1>Iniciar sesión</h1>
    
    <img class="logo-redondo" src="img/prueba.jpg" alt="Logo de utileria">

    <form id="login" novalidate>
      <label for="correo">Correo electrónico</label>
      <input id="correo" type="email" autocomplete="email">
      <p class="mensaje" id="err-correo"></p>

      <label for="password">Contraseña</label>
      <input id="password" type="password" autocomplete="current-password">
      <p class="mensaje" id="err-password"></p>

      <button type="submit">Entrar</button>
      <p class="resultado" id="resultado" role="status"></p>
    </form>
    <button type="button" class="secundario" onclick="window.location.href='index.html'">No tengo cuenta: ir a registro</button>
  </main>

  <script src="js/utileria.js"></script>
  <script src="js/login.js">  </script>
  
</body>
</html>
