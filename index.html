<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>utileria.js — Formulario de registro</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="tarjeta">
    <h1>Registrarse</h1>
    
    <img class="logo-redondo" src="img/prueba.jpg" alt="Logo de utileria">

    <form id="formulario" novalidate>
      <label for="nombre">Nombre completo</label>
      <input id="nombre" type="text" autocomplete="name">
      <p class="mensaje" id="err-nombre"></p>

      <label for="correo">Correo electrónico</label>
      <input id="correo" type="email" autocomplete="email">
      <p class="mensaje" id="err-correo"></p>  

      <label for="telefono">Teléfono (máx. 10 dígitos)</label>
      <input id="telefono" type="text" inputmode="numeric">
      <p class="mensaje" id="err-telefono"></p>

      <label for="nacimiento">Fecha de nacimiento</label>
      <input id="nacimiento" type="date">
      <p class="mensaje" id="err-nacimiento"></p>

      <label for="password">Contraseña</label>
      <input id="password" type="password" autocomplete="new-password">
      <p class="mensaje" id="err-password"></p>

      <button type="submit">Registrarme</button>
    </form>
    <button type="button" class="secundario" onclick="window.location.href='login.html'">Ya tengo cuenta: ir a iniciar sesión</button>
  </main>

  <div class="fondo-modal" id="fondoModal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitulo">
      <h2 id="modalTitulo">¡Hola, <span id="modalNombre"></span>!</h2>
      <div class="edad" id="modalEdad"></div>
      <p>años cumplidos</p>
      <p id="modalMayor"></p>
      <p id="modalCumple"></p>
      <button type="button" id="cerrarModal">Cerrar</button>
    </div>
  </div>

  <script src="js/utileria.js"></script> 
 <script src="js/index.js"></script>
</body>
</html>
